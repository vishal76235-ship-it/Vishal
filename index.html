    const seedServices = [

      { name: "आधार प्रिंट", category: "पहचान सेवा", fee: 30, icon: "▤", tone: "#e4edf5" },
      { name: "पैन कार्ड", category: "आवेदन", fee: 107, icon: "▧", tone: "#f7e6df" },
      { name: "रेल टिकट", category: "यात्रा", fee: 25, icon: "↗", tone: "#e5f3ee" },
      { name: "मोबाइल रिचार्ज", category: "रिचार्ज", fee: 5, icon: "▯", tone: "#f1e9f3" },
      { name: "आयुष्मान कार्ड", category: "स्वास्थ्य", fee: 0, icon: "+", tone: "#e5f3ee" },
      { name: "बैंकिंग सेवा", category: "वित्तीय", fee: 15, icon: "₹", tone: "#f7eed8" },
      { name: "फोटो कॉपी", category: "प्रिंटिंग", fee: 2, icon: "▣", tone: "#e4edf5" }
    ];
    const seedCustomers = [];
    const seedTransactions = [];
    const readStore = (key, fallback) => {
      try { const saved = localStorage.getItem(key); return saved ? JSON.parse(saved) : fallback; }
      catch { return fallback; }
    };
    let serviceCatalog = readStore("sevasetu-services", seedServices);
    let customers = readStore("sevasetu-customers", seedCustomers);
    let transactions = readStore("sevasetu-transactions", seedTransactions);
    let currentPage = "dashboard";
    let searchQuery = "";
    let transactionFilter = "all";
    const currency = value => new Intl.NumberFormat("hi-IN", { style: "currency", currency: "INR", maximumFractionDigits: 0 }).format(value);
    const esc = value => String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    const initials = name => name.trim().split(/\s+/).slice(0, 2).map(part => part[0]).join("");
    const save = () => {
      localStorage.setItem("sevasetu-services", JSON.stringify(serviceCatalog));
      localStorage.setItem("sevasetu-customers", JSON.stringify(customers));
      localStorage.setItem("sevasetu-transactions", JSON.stringify(transactions));
    };
    const todayLabel = new Intl.DateTimeFormat("hi-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date());
    function matching(text) { return !searchQuery || text.toLocaleLowerCase("hi").includes(searchQuery.toLocaleLowerCase("hi")); }
    function transactionRows(list) {
      if (!list.length) return '<tr><td colspan="6"><div class="empty">कोई रिकॉर्ड नहीं मिला</div></td></tr>';
      return list.map(item => `<tr><td><div class="cell-main">${esc(item.id)}</div><div class="cell-sub">${esc(item.date || "आज")} · ${esc(item.time)}</div></td><td><div class="customer-cell"><div class="small-avatar">${esc(initials(item.customer))}</div><div><div class="cell-main">${esc(item.customer)}</div><div class="cell-sub">${esc(item.phone)}</div></div></div></td><td>${esc(item.service)}</td><td class="amount">${currency(item.amount)}</td><td>${esc(item.mode)}</td><td><span class="status ${item.status === "पूर्ण" ? "status-paid" : "status-pending"}">${esc(item.status)}</span>${item.status === "लंबित" && item.mode === "UPI" ? ` <button class="text-button" data-action="mark-paid" data-transaction-id="${esc(item.id)}">प्राप्त दर्ज करें</button>` : ""}</td></tr>`).join("");
    }
    function dashboard() {
      const paid = transactions.filter(item => item.status === "पूर्ण" && item.date === "आज").reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const pending = transactions.filter(item => item.status === "लंबित").length;
      const todayCount = transactions.filter(item => item.date === "आज").length;
      const visibleTransactions = transactions.filter(item => matching([item.id, item.customer, item.phone, item.service, item.mode].join(" "))).slice(0, 5);

      </div>`;

    function customersPage() {

    function servicesPage() {
      const items = serviceCatalog.filter(item => matching([item.name, item.category].join(" ")));

    }
    const pageNames = { dashboard: "डैशबोर्ड", transactions: "लेन-देन", customers: "ग्राहक", services: "सेवाएँ", payments: "पेमेंट" };
    function render() {
      document.getElementById("breadcrumb").innerHTML = `केंद्र प्रबंधन&nbsp; / &nbsp;${pageNames[currentPage]}`;
      document.querySelectorAll(".nav button").forEach(button => button.classList.toggle("active", button.dataset.page === currentPage));
      document.getElementById("content").innerHTML = ({ dashboard, transactions: transactionsPage, customers: customersPage, services: servicesPage, payments: paymentsPage })[currentPage]();

    function showToast(message) {
      const root = document.getElementById("toastRoot");
      root.innerHTML = `<div class="toast">${esc(message)}</div>`;
      setTimeout(() => { root.innerHTML = ""; }, 2600);
    }
    function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
    function renderStoredPhoto(buttonId, photoKey, fallback, alt) {
      const button = document.getElementById(buttonId);
      const photo = readStore(photoKey, "");
      button.innerHTML = photo ? `<img src="${esc(photo)}" alt="${esc(alt)}">` : fallback;
    }
    function renderProfilePhoto() {
      ["profilePhotoButton", "mobileProfilePhotoButton"].forEach(buttonId => {
        if (document.getElementById(buttonId)) renderStoredPhoto(buttonId, "vishal-profile-photo", "V", "विशाल शर्मा की प्रोफ़ाइल फोटो");
      });
    }
    function renderBrandPhoto() {
      renderStoredPhoto("brandPhotoButton", "vishal-brand-photo", "VS", "विशाल ऑनलाइन सर्विसेज का लोगो");
    }
    function openPhotoModal(isBrand = false) {
      const config = isBrand
        ? { key: "vishal-brand-photo", button: "brandPhotoButton", fallback: "VS", label: "लोगो फोटो", preview: "brand-photo-preview", alt: "विशाल ऑनलाइन सर्विसेज का लोगो", removeAction: "remove-brand-photo" }
        : { key: "vishal-profile-photo", button: "profilePhotoButton", fallback: "V", label: "प्रोफ़ाइल फोटो", preview: "profile-photo-preview", alt: "विशाल शर्मा की प्रोफ़ाइल फोटो", removeAction: "remove-profile-photo" };
      const currentPhoto = readStore(config.key, "");
      document.getElementById("modalRoot").innerHTML = `<div class="modal-backdrop" data-dismiss="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="profilePhotoTitle"><div class="modal-head"><div class="modal-title" id="profilePhotoTitle">${config.label}</div><button class="close-button" type="button" data-close aria-label="बंद करें">×</button></div><form class="form" id="profilePhotoForm"><div class="${config.preview}" id="profilePhotoPreview">${currentPhoto ? `<img src="${esc(currentPhoto)}" alt="वर्तमान ${config.label}">` : config.fallback}</div><div class="field"><label for="profilePhotoFile">फोटो चुनें</label><input id="profilePhotoFile" type="file" accept="image/*" required></div><div class="cell-sub">फोटो अपने browser में सुरक्षित होगी.</div><div class="form-actions">${currentPhoto ? `<button class="button button-secondary" type="button" data-action="${config.removeAction}">फोटो हटाएँ</button>` : ""}<button class="button button-secondary" type="button" data-close>रद्द करें</button><button class="button button-primary" id="saveProfilePhoto" type="submit" disabled>फोटो सेव करें</button></div></form></section></div>`;
      let selectedPhoto = "";
      const fileInput = document.getElementById("profilePhotoFile");
      const saveButton = document.getElementById("saveProfilePhoto");
      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/") || file.size > 8 * 1024 * 1024) { showToast("8 MB से छोटी image चुनें"); fileInput.value = ""; return; }
        saveButton.disabled = true;
        const reader = new FileReader();
        reader.onerror = () => showToast("फोटो पढ़ी नहीं जा सकी");
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => showToast("यह image खुल नहीं सकी");
          image.onload = () => {
            const scale = Math.min(1, 512 / Math.max(image.width, image.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);
            const context = canvas.getContext("2d");
            if (!context) { showToast("फोटो तैयार नहीं हो सकी"); return; }
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            selectedPhoto = canvas.toDataURL("image/jpeg", 0.82);
            document.getElementById("profilePhotoPreview").innerHTML = `<img src="${esc(selectedPhoto)}" alt="नई प्रोफ़ाइल फोटो">`;
            saveButton.disabled = false;
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
      document.getElementById("profilePhotoForm").addEventListener("submit", event => {
        event.preventDefault();
        if (!selectedPhoto) return;
        try {
            localStorage.setItem(config.key, JSON.stringify(selectedPhoto));
            if (isBrand) renderBrandPhoto(); else renderProfilePhoto();
            closeModal(); showToast(`${config.label} सेव हुई`);
        } catch { showToast("फोटो सेव नहीं हो सकी"); }
      });
    }
    function openCustomerEdit(customerId) {
      const customer = customers.find(item => item.id === customerId);
      if (!customer) return;
      document.getElementById("modalRoot").innerHTML = `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="editCustomerTitle"><div class="modal-head"><div class="modal-title" id="editCustomerTitle">ग्राहक संपादित करें</div><button class="close-button" type="button" data-close aria-label="बंद करें">×</button></div><form class="form" id="editCustomerForm"><div class="field"><label for="editCustomerName">पूरा नाम</label><input id="editCustomerName" name="name" required maxlength="60" value="${esc(customer.name)}"></div><div class="field"><label for="editCustomerPhone">मोबाइल नंबर</label><input id="editCustomerPhone" name="phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर (वैकल्पिक)" value="${esc(customer.phone)}"></div><div class="form-actions"><button class="button button-secondary" type="button" data-close>रद्द करें</button><button class="button button-primary" type="submit">बदलाव सेव करें</button></div></form></section></div>`;
      document.getElementById("editCustomerForm").addEventListener("submit", event => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.currentTarget).entries());
        const oldName = customer.name;
        customer.name = data.name.trim();
        customer.phone = data.phone.trim() || customer.phone;
        transactions.forEach(item => {
          if (item.customer === oldName) { item.customer = customer.name; item.phone = customer.phone; }
        });
        save(); closeModal(); render(); showToast("ग्राहक का विवरण अपडेट हुआ");
      });
      document.getElementById("editCustomerName").focus();
    }
    function openModal(type, selectedService = "") {
      const isCustomer = type === "customer";
      const isService = type === "service";
      const title = isCustomer ? "नया ग्राहक" : isService ? "नई सेवा जोड़ें" : "नया लेन-देन";
      const customerOptions = customers.map(item => `<option value="${esc(item.name)}"></option>`).join("");
      const serviceOptions = serviceCatalog.map(item => `<option value="${esc(item.name)}" data-fee="${item.fee}" ${item.name === selectedService ? "selected" : ""}>${esc(item.name)}</option>`).join("") + '<option value="__custom_service__">अपनी सेवा लिखें</option>';
      const fields = isCustomer
        ? `<div class="field"><label for="customerName">पूरा नाम</label><input id="customerName" name="name" required maxlength="60" placeholder="ग्राहक का नाम"></div><div class="field"><label for="customerPhone">मोबाइल नंबर</label><input id="customerPhone" name="phone" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर"></div>`
        : isService
          ? `<div class="field"><label for="serviceName">सेवा का नाम</label><input id="serviceName" name="name" required maxlength="60" placeholder="जैसे: पानी का बिल"></div><div class="field"><label for="serviceCategory">श्रेणी</label><input id="serviceCategory" name="category" required maxlength="40" placeholder="जैसे: बिल भुगतान"></div><div class="field"><label for="serviceFee">सेवा शुल्क (₹)</label><input id="serviceFee" name="fee" type="number" min="0" step="1" required value="0"></div>`
          : `<div class="field"><label for="txCustomer">ग्राहक का नाम</label><input id="txCustomer" name="customer" list="txCustomerOptions" required maxlength="60" placeholder="नाम लिखें या पुराना ग्राहक चुनें"><datalist id="txCustomerOptions">${customerOptions}</datalist></div><div class="field"><label for="txPhone">मोबाइल नंबर (वैकल्पिक)</label><input id="txPhone" name="phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर"></div><div class="field"><label for="txService">सेवा</label><select id="txService" name="service" required>${serviceOptions}</select></div><div class="field" id="customTxServiceField" hidden><label for="txCustomService">अपनी सेवा का नाम</label><input id="txCustomService" name="customService" maxlength="60" placeholder="सेवा का नाम"></div><div class="form-row"><div class="field"><label for="txAmount">राशि (₹)</label><input id="txAmount" name="amount" type="number" min="0" step="1" required value="${serviceCatalog.find(item => item.name === selectedService)?.fee ?? serviceCatalog[0]?.fee ?? 0}"></div><div class="field"><label for="txMode">भुगतान माध्यम</label><select id="txMode" name="mode"><option>UPI</option><option>नकद</option><option>बैंक</option></select></div></div><div class="field"><label for="txStatus">भुगतान स्थिति</label><select id="txStatus" name="status"><option>पूर्ण</option><option>लंबित</option></select></div>`;
      const submitLabel = isCustomer ? "ग्राहक जोड़ें" : isService ? "सेवा जोड़ें" : "लेन-देन सेव करें";
      document.getElementById("modalRoot").innerHTML = `<div class="modal-backdrop" data-dismiss="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div class="modal-title" id="modalTitle">${title}</div><button class="close-button" type="button" data-close aria-label="बंद करें">×</button></div><form class="form" id="entryForm">${fields}<div class="form-actions"><button class="button button-secondary" type="button" data-close>रद्द करें</button><button class="button button-primary" type="submit">${submitLabel}</button></div></form></section></div>`;
      document.getElementById("entryForm").addEventListener("submit", event => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.currentTarget).entries());
        if (isCustomer) {
          customers.unshift({ id: `C-${1043 + customers.length - seedCustomers.length}`, name: data.name.trim(), phone: data.phone, joined: "आज" });
          showToast("ग्राहक रिकॉर्ड सेव हुआ");
        } else if (isService) {
          serviceCatalog.unshift({ name: data.name.trim(), category: data.category.trim(), fee: Number(data.fee), icon: "▦", tone: "#e5f3ee" });
          showToast("नई सेवा सूची में जोड़ दी गई");
        } else {
          const now = new Date();
          const serviceName = data.service === "__custom_service__" ? data.customService.trim() : data.service;
          const enteredName = data.customer.trim();
          const existingCustomer = customers.find(item => item.name.toLocaleLowerCase("hi") === enteredName.toLocaleLowerCase("hi"));
          const customer = existingCustomer || { id: `C-${1043 + customers.length - seedCustomers.length}`, name: enteredName, phone: data.phone.trim(), joined: "आज" };
          if (!existingCustomer) customers.unshift(customer);
          transactions.unshift({ id: `TX-${5822 + transactions.length - seedTransactions.length}`, customer: customer.name, phone: customer.phone || data.phone.trim(), service: serviceName, amount: Number(data.amount), mode: data.mode, status: data.status, time: now.toLocaleTimeString("hi-IN", { hour: "2-digit", minute: "2-digit" }), date: "आज" });
          showToast("लेन-देन सेव हुआ");
        }
        save(); closeModal(); render();
      });
      const serviceSelect = document.getElementById("txService");
      if (serviceSelect) serviceSelect.addEventListener("change", () => {
        const isCustom = serviceSelect.value === "__custom_service__";
        document.getElementById("customTxServiceField").hidden = !isCustom;
        document.getElementById("txCustomService").required = isCustom;
        if (isCustom) document.getElementById("txAmount").value = 0;
        else document.getElementById("txAmount").value = serviceCatalog.find(item => item.name === serviceSelect.value)?.fee ?? 0;
      });
      document.getElementById("modalRoot").querySelector("input")?.focus();
    }
    document.addEventListener("submit", event => {
      if (event.target.id !== "paymentRequestForm") return;
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target).entries());
      const upiId = data.upiId.trim();
      if (!/^[-A-Za-z0-9._]+@[-A-Za-z0-9.]+$/.test(upiId)) { showToast("सही UPI ID दर्ज करें"); return; }
      const customerName = data.customer.trim();
      const serviceName = data.service === "__custom_service__" ? data.customService.trim() : data.service;
      const transactionId = `TX-${5822 + transactions.length - seedTransactions.length}`;
      const now = new Date();
      if (!customers.some(item => item.name.toLocaleLowerCase("hi") === customerName.toLocaleLowerCase("hi"))) {
        customers.unshift({ id: `C-${1043 + customers.length - seedCustomers.length}`, name: customerName, phone: "", joined: "आज" });
      }
      transactions.unshift({ id: transactionId, customer: customerName, phone: customers.find(item => item.name === customerName)?.phone || "", service: serviceName, amount: Number(data.amount), mode: "UPI", status: "लंबित", time: now.toLocaleTimeString("hi-IN", { hour: "2-digit", minute: "2-digit" }), date: "आज" });
      localStorage.setItem("sevasetu-upi-id", JSON.stringify(upiId));
      save();
      const params = new URLSearchParams({ pa: upiId, pn: "विशाल ऑनलाइन सर्विसेज", am: Number(data.amount).toFixed(2), cu: "INR", tn: `${serviceName} - ${customerName}`, tr: transactionId });
      const paymentLink = `upi://pay?${params.toString()}`;
      render();
      document.getElementById("paymentLinkResult").innerHTML = `<div class="payment-result"><div class="field"><label for="paymentLink">पेमेंट लिंक · ${esc(transactionId)} · लंबित</label><input class="payment-link-input" id="paymentLink" readonly value="${esc(paymentLink)}"></div><div class="toolbar"><a class="button button-primary" href="${esc(paymentLink)}">UPI ऐप खोलें</a><button class="button button-secondary" type="button" data-action="copy-payment-link">लिंक कॉपी करें</button></div></div>`;
      showToast("पेमेंट अनुरोध बना; प्राप्ति की पुष्टि बाकी है");
    });
    document.addEventListener("click", event => {
      const clicked = event.target;
      const target = clicked.closest("button");
      if (!target) { if (clicked.matches(".modal-backdrop")) closeModal(); return; }
      if (target.id === "profilePhotoButton" || target.id === "mobileProfilePhotoButton") { openPhotoModal(); return; }
      if (target.id === "brandPhotoButton") { openPhotoModal(true); return; }
      if (target.dataset.page) { currentPage = target.dataset.page; render(); return; }
      if (target.dataset.action === "new-transaction") { openModal("transaction"); return; }
      if (target.dataset.action === "new-customer") { openModal("customer"); return; }
      if (target.dataset.action === "edit-customer") { openCustomerEdit(target.dataset.customerId); return; }
      if (target.dataset.action === "new-service") { openModal("service"); return; }
      if (target.dataset.action === "remove-profile-photo" || target.dataset.action === "remove-brand-photo") {
        const isBrand = target.dataset.action === "remove-brand-photo";
        const photoKey = isBrand ? "vishal-brand-photo" : "vishal-profile-photo";
        localStorage.removeItem(photoKey);
        if (isBrand) renderBrandPhoto(); else renderProfilePhoto();
        closeModal(); showToast(isBrand ? "लोगो फोटो हटाई गई" : "प्रोफ़ाइल फोटो हटाई गई"); return;
      }
      if (target.dataset.action === "mark-paid") {
        const transaction = transactions.find(item => item.id === target.dataset.transactionId);
        if (transaction && transaction.status === "लंबित") { transaction.status = "पूर्ण"; save(); render(); showToast("भुगतान प्राप्त दर्ज हुआ"); }
        return;
      }
      if (target.dataset.action === "copy-payment-link") {
        const input = document.getElementById("paymentLink");
        input.select(); input.setSelectionRange(0, input.value.length);
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(input.value).then(() => showToast("पेमेंट लिंक कॉपी हुआ")).catch(() => showToast("लिंक चुना गया; इसे कॉपी करें"));
        else showToast("लिंक चुना गया; इसे कॉपी करें");
        return;
      }
      if (target.dataset.action === "export") {
        const rows = [["रेफरेंस", "ग्राहक", "सेवा", "राशि", "माध्यम", "स्थिति"], ...transactions.map(item => [item.id, item.customer, item.service, item.amount, item.mode, item.status])];
        const csv = "\uFEFF" + rows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(",")).join("\r\n");
        const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); link.download = "sevasetu-transactions.csv"; link.click(); URL.revokeObjectURL(link.href); showToast("लेन-देन CSV डाउनलोड हुआ"); return;
      }
      if (target.dataset.service) { openModal("transaction", target.dataset.service); return; }
      if (target.hasAttribute("data-close")) closeModal();
    });
    document.addEventListener("change", event => {
      if (event.target.id === "statusFilter") { transactionFilter = event.target.value; render(); }
      if (event.target.id === "paymentService") {
        const isCustom = event.target.value === "__custom_service__";
        document.getElementById("paymentCustomServiceField").hidden = !isCustom;
        document.getElementById("paymentCustomService").required = isCustom;
        const fee = serviceCatalog.find(item => item.name === event.target.value)?.fee ?? 0;
        document.getElementById("paymentAmount").value = isCustom ? 1 : Math.max(1, fee);
      }
    });
    document.getElementById("globalSearch").addEventListener("input", event => { searchQuery = event.target.value.trim(); render(); });
    document.getElementById("notifyButton").addEventListener("click", () => showToast("आपकी सूचनाएँ अपडेट हैं"));
    document.addEventListener("keydown", event => { if (event.key === "Escape") closeModal(); });
    renderProfilePhoto();
    renderBrandPhoto();
    render();
  </script>
</body>
</html>
